# deploy-kit Project Intent for home-portal, the estate's landing page.
#
# The Project is `app`, so the namespace derives as `app-system`, where
# home-portal already runs, and the Process is `app-ui`, the name the live
# Deployment already has: the estate path takes over the live objects rather
# than creating a second copy (deploy-kit spec/v1/60-setup.md#adopting-a-live-application).
# The image is still home-portal; `app-ui` is the alias the images lock
# resolves it under.
#
# A static site: one Process, no storage, no secrets and no dependency, which
# is why it is the first Project handed over to the estate path
# (deploy-kit spec/v1/60-setup.md#handing-over-one-project-at-a-time).

apiVersion: intent.jorisjonkers.dev/v1
kind: Project
schemaVersion: 1.0.0

project: app # the namespace derives: app-system
owner: joris

applications:
  - id: home-portal
    # nginx exposes no metrics, so the Application declares no observability
    # block and wants no monitoring.

    exposure:
      - name: public
        host: jorisjonkers.dev
        audience: anonymous
        routes:
          - path: /
            match: prefix
            process: app-ui
            surface: http

    processes:
      - name: app-ui
        lifecycle: application
        image: app-ui # nginx serving the built site; the lock resolves digest, uid and gid
        runtime: static

        provides:
          http: 8080 # the unprivileged nginx: no capability to bind a port below 1024

        # nginx serving static files needs a few megabytes per worker.
        placement:
          memory: 64Mi
          cpu: 20m

        # The unprivileged nginx writes its pid file and temp files under /tmp.
        writablePaths: [/tmp]

        # The SPA's index is the only page there is, so both probes read it.
        probes:
          readiness:
            path: /
            port: 8080
          liveness:
            path: /
            port: 8080

        startupBudget: 10s

        # No volumes and no state, so a continuous cutover is honourable.
        cutover: continuous
