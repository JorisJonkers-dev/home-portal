name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: 'ci-${{ github.workflow }}-${{ github.ref }}'
  cancel-in-progress: "${{ github.ref != 'refs/heads/main' }}"

permissions:
  contents: read
  packages: read

env:
  NODE_VERSION: '24'

jobs:
  workflow-lint:
    name: Workflow Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install actionlint
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/actionlint
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) latest /tmp/actionlint

      - name: Run actionlint
        run: '/tmp/actionlint/actionlint .github/workflows/*.yml'

  web-check:
    name: 'Lint, Typecheck, Test, Build'
    uses: JorisJonkers-dev/github-workflows/.github/workflows/node-ci.yml@8aaf024208bf4b29acb468aecd3cd7ee130d5ac1 # v0.49.1
    with:
      node-version: '24'
      package-manager: pnpm
      typecheck-command: pnpm typecheck
      test-command: 'pnpm test:coverage'
      build-command: pnpm build
      lint-command: pnpm depcruise
      require-package-proxy: true
    secrets:
      packages-token: '${{ secrets.GITHUB_TOKEN }}'
      PACKAGES_PROXY_TOKEN: ${{ secrets.PACKAGES_PROXY_TOKEN }}

  # The Playwright version the lockfile resolves, so the container below always carries the
  # browsers that version expects, also after Renovate bumps @playwright/test.
  e2e-version:
    name: Playwright version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: '${{ steps.read.outputs.version }}'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - id: read
        shell: bash
        run: |
          set -euo pipefail
          version="$(grep -m1 -E "^  '@playwright/test@[0-9]" pnpm-lock.yaml | sed -E "s/^  '@playwright\/test@([0-9][^']*)':.*/\1/")"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "no @playwright/test version in pnpm-lock.yaml" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # Each browser in two shards, six jobs at once. The official Playwright image already holds the
  # browsers and every system package they need, so no job waits on apt mirrors.
  e2e:
    name: 'Playwright E2E (${{ matrix.browser }} ${{ matrix.shard }}/2)'
    needs: e2e-version
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: 'mcr.microsoft.com/playwright:v${{ needs.e2e-version.outputs.version }}-noble'
      options: --ipc=host
    env:
      # Firefox refuses a HOME the container's root user does not own.
      HOME: /root
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
        shard: [1, 2]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: JorisJonkers-dev/github-workflows/actions/setup-package-proxy@8aaf024208bf4b29acb468aecd3cd7ee130d5ac1 # v0.49.1
        with:
          token: ${{ secrets.PACKAGES_PROXY_TOKEN }}
          require-package-proxy: true

      # The version is package.json's packageManager; naming it here too fails the step.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '${{ env.NODE_VERSION }}'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        env:
          NODE_AUTH_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
        run: |
          pnpm config set //npm.pkg.github.com/:_authToken "$NODE_AUTH_TOKEN"
          pnpm install --frozen-lockfile

      - name: Run the shard
        run: 'pnpm test:e2e --project=${{ matrix.browser }} --shard=${{ matrix.shard }}/2'

      - name: Keep the shard's report
        if: '${{ !cancelled() }}'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: 'blob-report-${{ matrix.browser }}-${{ matrix.shard }}'
          path: blob-report
          retention-days: 7

  # One HTML report from every shard, for reading a failure; not a required check.
  e2e-report:
    name: Playwright report
    if: '${{ !cancelled() }}'
    needs: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: JorisJonkers-dev/github-workflows/actions/setup-package-proxy@8aaf024208bf4b29acb468aecd3cd7ee130d5ac1 # v0.49.1
        with:
          token: ${{ secrets.PACKAGES_PROXY_TOKEN }}
          require-package-proxy: true

      # The version is package.json's packageManager; naming it here too fails the step.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '${{ env.NODE_VERSION }}'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        env:
          NODE_AUTH_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
        run: |
          pnpm config set //npm.pkg.github.com/:_authToken "$NODE_AUTH_TOKEN"
          pnpm install --frozen-lockfile

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true

      - run: pnpm exec playwright merge-reports --reporter html ./all-blob-reports

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  mutation:
    name: Mutation Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: JorisJonkers-dev/github-workflows/actions/setup-package-proxy@8aaf024208bf4b29acb468aecd3cd7ee130d5ac1 # v0.49.1
        with:
          token: ${{ secrets.PACKAGES_PROXY_TOKEN }}
          require-package-proxy: true

      # The version is package.json's packageManager; naming it here too fails the step.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '${{ env.NODE_VERSION }}'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        env:
          NODE_AUTH_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
        run: |
          pnpm config set //npm.pkg.github.com/:_authToken "$NODE_AUTH_TOKEN"
          pnpm install --frozen-lockfile

      - run: pnpm stryker

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Write packages proxy netrc
        id: proxy
        shell: bash
        env:
          PACKAGES_PROXY_TOKEN: '${{ secrets.PACKAGES_PROXY_TOKEN }}'
        run: |
          set -euo pipefail

          if [ -z "$PACKAGES_PROXY_TOKEN" ]; then
            echo "::warning::PACKAGES_PROXY_TOKEN is not set; packages install without the proxy."
            exit 0
          fi

          printf '::add-mask::%s\n' "$PACKAGES_PROXY_TOKEN"
          umask 077
          netrc="$RUNNER_TEMP/packages-netrc"
          {
            printf 'machine packages.jorisjonkers.dev\n'
            printf 'login packages\n'
            printf 'password %s\n' "$PACKAGES_PROXY_TOKEN"
          } > "$netrc"
          npmrc="$RUNNER_TEMP/packages-npmrc"
          {
            printf 'registry=https://packages.jorisjonkers.dev/npm/\n'
            printf '//packages.jorisjonkers.dev/npm/:_authToken=%s\n' "$PACKAGES_PROXY_TOKEN"
            printf '@jorisjonkers-dev:registry=https://npm.pkg.github.com\n'
          } > "$npmrc"
          {
            printf 'netrc=%s\n' "$netrc"
            printf 'npmrc=%s\n' "$npmrc"
            printf 'enabled=true\n'
          } >> "$GITHUB_OUTPUT"

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          push: false
          tags: 'ghcr.io/jorisjonkers-dev/home-portal:ci-${{ github.sha }}'
          build-args: |
            ${{ steps.proxy.outputs.enabled == 'true' && 'GOPROXY=https://packages.jorisjonkers.dev/go' || '' }}
            ${{ steps.proxy.outputs.enabled == 'true' && 'PIP_INDEX_URL=https://packages.jorisjonkers.dev/pypi/simple/' || '' }}
            ${{ steps.proxy.outputs.enabled == 'true' && 'UV_DEFAULT_INDEX=https://packages.jorisjonkers.dev/pypi/simple/' || '' }}
          secrets: |
            github_token=${{ secrets.GITHUB_TOKEN }}
          secret-files: |
            ${{ steps.proxy.outputs.enabled == 'true' && format('packages-netrc={0}', steps.proxy.outputs.netrc) || '' }}
            ${{ steps.proxy.outputs.enabled == 'true' && format('packages-npmrc={0}', steps.proxy.outputs.npmrc) || '' }}

  pipeline-complete:
    name: Pipeline Complete
    if: '${{ always() }}'
    needs:
      - workflow-lint
      - web-check
      - e2e-version
      - e2e
      - mutation
      - docker-build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check required jobs
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # release/v1
        with:
          jobs: '${{ toJSON(needs) }}'
