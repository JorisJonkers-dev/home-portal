# Tag-triggered publish flow.
#
# push of a v*.*.* tag (authored by release.yml via the App token) drives:
#   publish-image -> resolve-image-lock -> fragment (the estate path)
name: Publish

on:
  push:
    tags:
      - 'v*.*.*'

permissions: {}

jobs:
  # -- 1. Build and push the container image --------------------------------
  # Reusable workflow: consume its results via needs.<job>.outputs downstream;
  # a `uses:` job must not redeclare an outputs: block.
  publish-image:
    uses: JorisJonkers-dev/github-workflows/.github/workflows/container-publish.yml@f3bb6cabaa6ee33694f8632ce273a4e703d60780 # v0.38.0
    with:
      # Restored: adopting the shared publish flow dropped the inline
      # build-push-action's platforms value, so this fell back to the
      # workflow's linux/amd64 default and the arm64 nodes could not pull.
      platforms: linux/amd64,linux/arm64
      image-name: home-portal
      version: ${{ github.ref_name }}
    permissions:
      contents: read
      packages: write

  # -- 2. Resolve the image lock (upload artifact, never path) --------------
  resolve-image-lock:
    needs: [publish-image]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    outputs:
      fragment-images-lock-artifact: fragment-images-lock-${{ github.run_id }}
    steps:
      # The estate path's images lock share: this release's image, under the alias the project file names,
      # with the user the image runs as and the version it ships, read back from what was pushed.
      - name: lock-fragment-image
        uses: JorisJonkers-dev/github-workflows/actions/resolve-image-lock@f3bb6cabaa6ee33694f8632ce273a4e703d60780 # v0.38.0
        with:
          name: home-portal
          images: |
            home-portal
          tag: ${{ github.ref_name }}
          artifact-name: fragment-images-lock-${{ github.run_id }}

  # -- 3. Publish the Intent Fragment and start composition ------------------
  # The project file, packed with this release's share of the images lock,
  # pushed, signed keyless and verified, then composition dispatched in
  # JorisJonkers-dev/estate (deploy-kit spec/v1/40-composition.md#fragments).
  fragment:
    needs: [resolve-image-lock]
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: JorisJonkers-dev/github-workflows/.github/workflows/publish-fragment.yml@f3bb6cabaa6ee33694f8632ce273a4e703d60780 # v0.38.0
    with:
      project-file: deploy/home-portal.project.yml
      version: ${{ github.ref_name }}
      images-lock-artifact: ${{ needs.resolve-image-lock.outputs.fragment-images-lock-artifact }}
    secrets:
      ESTATE_DISPATCH_APP_PRIVATE_KEY: ${{ secrets.ESTATE_DISPATCH_APP_PRIVATE_KEY }}
